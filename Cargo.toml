[package]
name = "guvnor"
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pzfreo/guvnor"

[dependencies]
core-foundation = "0.10.1"
libc = "0.2.190"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
libc = "0.2.190"
