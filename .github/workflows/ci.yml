name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --bins
      # These run the real governor, which needs the SMC (fans and die sensors). Hosted runners
      # are virtual machines that may not have one, so a failure here is reported, not fatal.
      - name: Crash-safety tests (need the SMC)
        continue-on-error: true
        run: cargo test --locked --test crash
